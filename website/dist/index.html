<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07131b" />
    <meta name="description" content="四语汽车车名快速检索：英文、简体中文、繁体中文与日语并列展示。" />
    <title>Vehicle Name Index · 多语言车名资料库</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307131b'/%3E%3Cpath d='M12 38h40l-4-15H17z' fill='%2357e3c0'/%3E%3Cpath d='M18 38v7m28-7v7' stroke='%23edf7f5' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='43' r='5' fill='%2307131b' stroke='%23edf7f5' stroke-width='3'/%3E%3Ccircle cx='43' cy='43' r='5' fill='%2307131b' stroke='%23edf7f5' stroke-width='3'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #edf7f5;
        --muted: #93a7aa;
        --line: rgba(188, 223, 218, 0.16);
        --surface: #0d2027;
        --surface-strong: #132e37;
        --canvas: #07131b;
        --accent: #57e3c0;
        --accent-ink: #06221d;
        --warning: #f8cc76;
        --radius: 14px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 84% -12%, rgba(87, 227, 192, 0.17), transparent 30rem),
          linear-gradient(150deg, #07131b 0%, #08171f 55%, #07131b 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Hiragino Sans", sans-serif;
      }
      button, input, select { font: inherit; }
      button, select { cursor: pointer; }
      a { color: inherit; }
      .shell { width: min(1440px, calc(100% - 2.25rem)); margin: 0 auto; }

      .masthead { padding: 2.2rem 0 1.35rem; border-bottom: 1px solid var(--line); }
      .masthead-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.5rem; }
      .eyebrow { margin: 0 0 .55rem; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .13em; }
      h1 { margin: 0; max-width: 18ch; font-size: clamp(1.75rem, 4vw, 3.25rem); line-height: 1.04; letter-spacing: -.045em; }
      .intro { max-width: 48rem; margin: .8rem 0 0; color: var(--muted); font-size: 1rem; line-height: 1.65; }
      .source-link { flex: none; color: var(--muted); font-size: .88rem; text-decoration-color: rgba(147, 167, 170, .55); text-underline-offset: .2rem; }
      .source-link:hover { color: var(--accent); }

      .workspace { padding: 1.4rem 0 3rem; }
      .controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, .36fr) auto; gap: .75rem; align-items: end; }
      .control-label { display: grid; gap: .38rem; color: var(--muted); font-size: .78rem; font-weight: 750; letter-spacing: .04em; }
      .search-box { position: relative; }
      .search-box svg { position: absolute; top: 50%; left: .95rem; width: 1.15rem; height: 1.15rem; transform: translateY(-50%); color: var(--accent); pointer-events: none; }
      input, select, .clear-button {
        min-height: 3.15rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        background: rgba(13, 32, 39, .88);
        outline: none;
      }
      input { width: 100%; padding: .75rem .85rem .75rem 2.85rem; font-size: 1rem; }
      select { width: 100%; padding: .7rem .8rem; font-size: .95rem; }
      input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(87, 227, 192, .14); }
      .clear-button { padding: .65rem 1rem; color: var(--muted); font-size: .9rem; }
      .clear-button:hover { color: var(--ink); border-color: rgba(87, 227, 192, .6); }

      .results-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.4rem 0 .9rem; }
      .result-count { margin: 0; font-size: 1rem; font-weight: 700; }
      .result-count strong { color: var(--accent); font-variant-numeric: tabular-nums; }
      .data-note { margin: 0; color: var(--muted); font-size: .79rem; }
      .language-key { display: flex; flex-wrap: wrap; gap: .38rem; justify-content: flex-end; }
      .language-key span { border: 1px solid var(--line); border-radius: 999px; padding: .22rem .55rem; color: var(--muted); font-size: .72rem; }

      .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .75rem; }
      .model-card { display: grid; overflow: hidden; min-height: 16.5rem; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgba(19, 46, 55, .9), rgba(11, 27, 34, .96)); }
      .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; padding: 1rem 1rem .8rem; border-bottom: 1px solid var(--line); }
      .brand { margin: 0; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
      .model-id { margin: .24rem 0 0; color: var(--muted); font-size: .72rem; overflow-wrap: anywhere; }
      .status { flex: none; border-radius: 999px; padding: .28rem .48rem; color: var(--accent-ink); background: var(--accent); font-size: .68rem; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
      .status.discontinued { color: #2e2208; background: var(--warning); }
      .status.concept { color: #251536; background: #dfb8ff; }
      .names { display: grid; gap: .62rem; padding: .95rem 1rem; align-content: start; }
      .name-row { display: grid; grid-template-columns: 4.55rem minmax(0, 1fr); gap: .55rem; align-items: baseline; }
      .lang { color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .07em; }
      .name { color: var(--ink); font-size: 1rem; font-weight: 630; line-height: 1.35; overflow-wrap: anywhere; }
      .card-footer { display: flex; flex-wrap: wrap; align-self: end; gap: .35rem; padding: .75rem 1rem 1rem; }
      .tag { border: 1px solid var(--line); border-radius: 999px; padding: .2rem .48rem; color: var(--muted); font-size: .69rem; font-variant-numeric: tabular-nums; }
      .empty { grid-column: 1 / -1; padding: 3.5rem 1.5rem; border: 1px dashed rgba(188, 223, 218, .3); border-radius: var(--radius); color: var(--muted); text-align: center; }
      .empty strong { display: block; margin-bottom: .45rem; color: var(--ink); font-size: 1.1rem; }
      .loading { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
      .skeleton { height: 16.5rem; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(90deg, rgba(19,46,55,.45), rgba(43,81,89,.6), rgba(19,46,55,.45)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
      @keyframes shimmer { to { background-position: -200% 0; } }

      .pagination { display: flex; justify-content: center; align-items: center; gap: .75rem; margin: 1.5rem 0 .5rem; }
      .page-button { min-height: 2.6rem; border: 1px solid var(--line); border-radius: 9px; padding: .45rem .85rem; color: var(--ink); background: var(--surface); }
      .page-button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      .page-button:disabled { cursor: not-allowed; opacity: .42; }
      #page-label { min-width: 7.2rem; color: var(--muted); font-size: .85rem; text-align: center; font-variant-numeric: tabular-nums; }
      footer { padding: 1rem 0 2.5rem; color: var(--muted); font-size: .78rem; text-align: center; }

      @media (max-width: 760px) {
        .shell { width: min(100% - 1.25rem, 1440px); }
        .masthead { padding-top: 1.5rem; }
        .masthead-inner, .results-meta { display: block; }
        .source-link { display: inline-block; margin-top: .9rem; }
        .controls { grid-template-columns: 1fr; }
        .clear-button { width: 100%; }
        .language-key { justify-content: flex-start; margin-top: .75rem; }
        .data-note { margin-top: .7rem; }
        .results { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="shell masthead-inner">
        <div>
          <p class="eyebrow">VEHICLE / NAME INDEX</p>
          <h1>四种语言，一次找到正确车名。</h1>
          <p class="intro">检索车型、品牌与别名。每个结果同时呈现英文、简体中文、繁体中文和日语，便于跨市场核对与写作。</p>
        </div>
        <a class="source-link" href="https://github.com/ixiehao/vehicle-name" target="_blank" rel="noreferrer">查看开源数据源</a>
      </div>
    </header>

    <main class="shell workspace">
      <section aria-label="车型检索">
        <div class="controls">
          <label class="control-label" for="query">快速检索 <span>支持任意语言、品牌或型号</span>
            <span class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
              <input id="query" type="search" autocomplete="off" spellcheck="false" placeholder="例如：Corolla、卡罗拉、カローラ、Toyota" />
            </span>
          </label>
          <label class="control-label" for="brand-filter">品牌
            <select id="brand-filter"><option value="">全部品牌</option></select>
          </label>
          <button class="clear-button" id="clear-search" type="button">清除筛选</button>
        </div>

        <div class="results-meta" aria-live="polite">
          <div>
            <p class="result-count" id="result-count">正在载入资料库…</p>
            <p class="data-note" id="data-note">数据将从项目的公开构建产物读取。</p>
          </div>
          <div class="language-key" aria-label="语言栏位说明"><span>EN English</span><span>简中 zh-CN</span><span>繁中 zh-TW</span><span>日本語 ja</span></div>
        </div>

        <div class="results" id="results" aria-live="polite">
          <div class="loading" aria-label="正在载入"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
        <nav class="pagination" id="pagination" aria-label="车型结果分页" hidden>
          <button class="page-button" id="previous-page" type="button">上一页</button>
          <span id="page-label"></span>
          <button class="page-button" id="next-page" type="button">下一页</button>
        </nav>
      </section>
    </main>
    <footer class="shell">车名资料仅供学习、翻译与检索参考；正式发布请以品牌官方信息为准。</footer>

    <script>
      (() => {
        const DATA_URLS = [
          "https://raw.githubusercontent.com/ixiehao/vehicle-name/main/vehicle-names-database/dist/vehicle-names-database.json",
          "https://cdn.jsdelivr.net/gh/ixiehao/vehicle-name@main/vehicle-names-database/dist/vehicle-names-database.json"
        ];
        const PAGE_SIZE = 60;
        const fields = ["en", "zh-CN", "zh-TW", "ja"];
        const labels = { en: "EN", "zh-CN": "简中", "zh-TW": "繁中", ja: "日本語" };
        const query = document.querySelector("#query");
        const brandFilter = document.querySelector("#brand-filter");
        const clearButton = document.querySelector("#clear-search");
        const results = document.querySelector("#results");
        const resultCount = document.querySelector("#result-count");
        const dataNote = document.querySelector("#data-note");
        const pagination = document.querySelector("#pagination");
        const previousPage = document.querySelector("#previous-page");
        const nextPage = document.querySelector("#next-page");
        const pageLabel = document.querySelector("#page-label");
        let models = [];
        let page = 1;

        const normalise = (value) => String(value || "").toLocaleLowerCase();
        const escapeHtml = (value) => String(value || "—").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
        const statusText = (status) => ({ current: "在售", discontinued: "停产", concept: "概念" })[status] || status || "资料";

        function filteredModels() {
          const term = normalise(query.value.trim());
          const selectedBrand = brandFilter.value;
          return models.filter((model) => {
            if (selectedBrand && model.brand !== selectedBrand) return false;
            if (!term) return true;
            const text = [model.id, model.brand, model.note, ...fields.map((field) => model.names?.[field])].map(normalise).join(" ");
            return text.includes(term);
          });
        }

        function render() {
          const filtered = filteredModels();
          const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
          page = Math.min(page, pages);
          const start = (page - 1) * PAGE_SIZE;
          const current = filtered.slice(start, start + PAGE_SIZE);
          resultCount.innerHTML = `找到 <strong>${filtered.length.toLocaleString()}</strong> 个车型`;
          dataNote.textContent = filtered.length ? `当前显示第 ${start + 1}–${Math.min(start + PAGE_SIZE, filtered.length)} 个结果，可直接按任意语言继续缩小范围。` : "请尝试其他车型、品牌或语言名称。";
          pagination.hidden = filtered.length <= PAGE_SIZE;
          pageLabel.textContent = `第 ${page} / ${pages} 页`;
          previousPage.disabled = page === 1;
          nextPage.disabled = page === pages;

          if (!current.length) {
            results.innerHTML = '<div class="empty"><strong>没有找到匹配车型</strong>试试品牌英文名、当地译名，或清除筛选。</div>';
            return;
          }
          results.innerHTML = current.map((model) => {
            const status = String(model.status || "current");
            const names = fields.map((field) => `<div class="name-row"><span class="lang">${labels[field]}</span><span class="name">${escapeHtml(model.names?.[field])}</span></div>`).join("");
            const tags = [model.years, model.segment?.replace("class:", ""), model.body_style?.replace("body:", ""), model.powertrain?.replace("pt:", "")].filter(Boolean).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
            return `<article class="model-card"><div class="card-top"><div><p class="brand">${escapeHtml(model.brand)}</p><p class="model-id">${escapeHtml(model.id)}</p></div><span class="status ${escapeHtml(status)}">${statusText(status)}</span></div><div class="names">${names}</div><div class="card-footer">${tags}</div></article>`;
          }).join("");
        }

        function resetAndRender() { page = 1; render(); }

        async function loadData() {
          let lastError;
          for (const url of DATA_URLS) {
            try {
              const response = await fetch(url, { cache: "no-cache" });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const database = await response.json();
              models = database.models?.list || [];
              if (!models.length) throw new Error("车型数据为空");
              const brands = [...new Set(models.map((model) => model.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b));
              brandFilter.insertAdjacentHTML("beforeend", brands.map((brand) => `<option value="${escapeHtml(brand)}">${escapeHtml(brand)}</option>`).join(""));
              dataNote.textContent = `数据版本 ${database.meta?.database_version || "—"} · 更新于 ${database.meta?.updated || "—"} · ${models.length.toLocaleString()} 个车型`;
              render();
              return;
            } catch (error) { lastError = error; }
          }
          results.innerHTML = '<div class="empty"><strong>暂时无法读取车型资料</strong>请检查网络连接后刷新页面，或前往 GitHub 数据仓库查阅。</div>';
          resultCount.textContent = "资料库加载失败";
          dataNote.textContent = lastError ? `加载错误：${lastError.message}` : "加载错误";
        }

        query.addEventListener("input", resetAndRender);
        brandFilter.addEventListener("change", resetAndRender);
        clearButton.addEventListener("click", () => { query.value = ""; brandFilter.value = ""; resetAndRender(); query.focus(); });
        previousPage.addEventListener("click", () => { page -= 1; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
        nextPage.addEventListener("click", () => { page += 1; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
        window.addEventListener("keydown", (event) => { if (event.key === "/" && document.activeElement !== query && document.activeElement?.tagName !== "SELECT") { event.preventDefault(); query.focus(); } });
        loadData();
      })();
    </script>
  </body>
</html>
